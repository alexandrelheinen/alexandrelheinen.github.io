    async function enhanceArticleContent(root, frontMatter) {

        }

      var wrapper = document.createElement('div');
      wrapper.innerHTML = buildTextBackLink(options);
      beforeElement.parentElement.insertBefore(wrapper.firstChild, beforeElement);
    }

    async function renderRuntimeDetailSection(options) {

      var section = document.createElement('section');

      var body = document.createElement('div');
      body.className = 'article-content';
      body.innerHTML = await renderRichContent(options.bodyMarkdown, fm);

        footer.innerHTML = buildTextFooterNav(options.footerNav);
        if (footer.firstChild) section.appendChild(footer.firstChild);
      }

    }

    function reportDetailLoadError(error, options) {

      var message = options.emptyState.querySelector('p');
      if (message) message.textContent = options.message || 'Content could not be loaded right now.';
      options.grid.insertBefore(options.emptyState, options.noResults || null);
    }

    async function renderRichContent(markdown, frontMatter) {
      var fm = frontMatter || {};
      var prepared = stripFrontMatter(markdown).replace(/\{%-?\s*assign\s+\w+\s*=\s*site\.data\.transcriptions\[[^\]]+\]\.transcription\s*-?%\}\s*/g, '');
      var replacements = [];
      prepared = prepared.replace(/\{%-?\s*include\s+transcription\.html\s+([\s\S]*?)-?%\}/g, function (match, raw) {
        var index = replacements.length;
        var attrs = parseIncludeAttrs(raw);
        var path = normalizeDataPath(attrs.path || attrs.file || attrs.src, '');
        if (!path && fm.transcription) path = normalizeDataPath(fm.transcription, 'data/transcriptions');
        replacements.push(path ? loadJson(path).then(function (data) { return transcriptionHtml(data, attrs); }) : Promise.resolve(''));
        return '%%CONTENT_RUNTIME_REPLACEMENT_' + index + '%%';
      });
      prepared = prepared.replace(/\{%-?\s*include\s+chord-tab\.html\s+([\s\S]*?)-?%\}/g, function (match, raw) {
        var index = replacements.length;
        var attrs = parseIncludeAttrs(raw);
        var path = normalizeDataPath(attrs.path || attrs.file || attrs.src || attrs.tab, 'data/tabs');
        replacements.push(path ? loadJson(path).then(chordTabHtml) : Promise.resolve(''));
        return '%%CONTENT_RUNTIME_REPLACEMENT_' + index + '%%';
      });
      var html = renderMarkdown(prepared);
      var resolved = await Promise.all(replacements);
      resolved.forEach(function (replacement, index) {
        html = html.replace('<p>%%CONTENT_RUNTIME_REPLACEMENT_' + index + '%%</p>', replacement);
        html = html.replace('%%CONTENT_RUNTIME_REPLACEMENT_' + index + '%%', replacement);
      });
      if (fm.tab && !/\{%-?\s*include\s+chord-tab\.html/.test(String(markdown || ''))) {
        try {
          html += chordTabHtml(await loadJson(normalizeDataPath(fm.tab, 'data/tabs')));
        } catch (e) {
          console.error(e);
        }
      }
      return html;
    }

    function textExcerpt(markdown) {
      var html = renderMarkdown(markdown);
      var el = document.createElement('div');
      el.innerHTML = html;
      var text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      return text.length > 220 ? text.slice(0, 217).trim() + '...' : text;
    }

    function formatDate(value, locale) {
      if (!value) return '';
      var parts = String(value).slice(0, 10).split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return value;
      return new Intl.DateTimeFormat(locale || 'en', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      }).format(new Date(parts[0], parts[1] - 1, parts[2]));
    }

    function chronologySortKey(item) {
      var fm = item.front_matter || {};
      var primary = fm.last_updated || fm.date || '';
      var tiebreaker = fm.date || item.slug || '';
      return String(primary) + '\0' + String(tiebreaker);
    }

    function dateKey(value) {
      if (value == null || value === '') return '';
      return String(value).slice(0, 10);
    }

    function renderDateEvolution(date, lastUpdated, locale, options) {
      options = options || {};
      var created = formatDate(date, locale);
      var updated = formatDate(lastUpdated, locale);
      var hasUpdate = dateKey(lastUpdated) && dateKey(lastUpdated) !== dateKey(date);
      if (!created && !(hasUpdate && updated)) return '';
      var align = options.align === 'right' ? ' items-end' : '';
      var gap = options.gap || 'gap-1';
      var publishedTitle = options.publishedLabel || 'Published';
      var updatedTitle = options.updatedLabel || 'Updated';
      var html = '<div class="date-evolution flex flex-col ' + gap + align + '">';
      if (created) {
        html += '<span' + (options.showLabels ? '' : ' title="' + escapeAttr(publishedTitle) + '"') + '>';
        if (options.showLabels) html += escapeHtml(publishedTitle) + ': ';
        html += escapeHtml(created) + '</span>';
      }
      if (hasUpdate && updated) {
        html += '<span class="opacity-60"' + (options.showLabels ? '' : ' title="' + escapeAttr(updatedTitle) + '"') + '>';
        if (options.showLabels) html += escapeHtml(updatedTitle) + ': ';
        html += escapeHtml(updated) + '</span>';
      }
      html += '</div>';
      return html;
    }

    async function listPaths(collection, manifestKey) {
      var manifestResponse = await fetch(buildUrl('manifest.json'));
      if (manifestResponse.ok) {
        var manifest = await manifestResponse.json();
        var files = manifest.files && manifest.files[manifestKey];
        if (Array.isArray(files)) return files;
      }

      var response = await fetch(buildUrl('?prefix=' + collection + '/'));
      if (!response.ok) throw new Error('Bucket listing failed: ' + response.status);
      var xml = await response.text();
      var doc = new DOMParser().parseFromString(xml, 'application/xml');
      var re = new RegExp('^' + collection.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '/.+\\.json$');
      return Array.from(doc.getElementsByTagName('Key'))
        .map(function (node) { return node.textContent; })
        .filter(function (path) { return re.test(path); });
    }

    async function loadCollection(collection, manifestKey) {
      var paths = await listPaths(collection, manifestKey);
      var items = await Promise.all(paths.map(function (path) {
        return fetch(buildUrl(path)).then(function (response) {
          if (!response.ok) throw new Error('Content fetch failed: ' + path);
          return response.json();
        });
      }));
      return items.map(hydrateFrontMatter).filter(function (item) {
        return !(item.front_matter && item.front_matter.published === false);
      });
    }

    async function loadJson(path) {
      var response = await fetch(buildUrl(path));
      if (!response.ok) throw new Error('Content JSON fetch failed: ' + path);
      return response.json();
    }

    return {
      buildUrl: buildUrl,
      contentBase: contentBase,
      escapeHtml: escapeHtml,
      escapeAttr: escapeAttr,
      chronologySortKey: chronologySortKey,
      formatDate: formatDate,
      renderDateEvolution: renderDateEvolution,
      loadCollection: loadCollection,
      loadJson: loadJson,
      placeholderHtml: placeholderHtml,
      renderRichContent: renderRichContent,
      enhanceArticleContent: enhanceArticleContent,
      insertRuntimeBackLink: insertRuntimeBackLink,
      removeRuntimeBackLink: removeRuntimeBackLink,
      renderRuntimeDetailSection: renderRuntimeDetailSection,
      reportDetailLoadError: reportDetailLoadError,
      buildTextSidebar: buildTextSidebar,
      buildTextBackLink: buildTextBackLink,
      buildTextFooterNav: buildTextFooterNav,
      translate: translate,
      typesetMath: typesetMath,
      renderMarkdown: renderMarkdown,
      textExcerpt: textExcerpt
    };
  })();
</script>
